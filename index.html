<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nicholas Griffiths, full-stack engineer. React, TypeScript, Node, PostgreSQL. ClackForge: a Three.js product configurator with Stripe checkout and full test coverage."
    />
    <link rel="canonical" href="https://nickhgriffiths.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nickhgriffiths.com/" />
    <meta property="og:title" content="Nicholas Griffiths - Full Stack Developer" />
    <meta
      property="og:description"
      content="Nicholas Griffiths, full-stack engineer. React, TypeScript, Node, PostgreSQL. ClackForge: a Three.js product configurator with Stripe checkout and full test coverage."
    />
    <meta property="og:image" content="https://nickhgriffiths.com/assets/images/hero-portrait-cutout.webp" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Nicholas Griffiths - Full Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify scans static HTML at build-time; this hidden form enables form detection for the SPA. -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      data-netlify-recaptcha="true"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
